<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mixes – DJ Carlos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0D0D0D;
      --purple: #8B5CF6;
      --pink:   #EC4899;
      --white:  #F8F8F8;
      --card:   #111111;
      --nav-h:  64px;
      --bar-h:  76px;
      --sp-h:   min(484px, 92dvh);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding-bottom: var(--bar-h); /* don't hide content behind sticky bar */
    }

    /* ── NAV ─────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(1.25rem, 5vw, 3rem);
      background: rgba(13,13,13,.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(139,92,246,.18);
    }

    .nav-logo {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: .12em;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .nav-links { display: flex; gap: clamp(1.25rem, 3vw, 2.5rem); list-style: none; }

    .nav-links a {
      color: rgba(248,248,248,.65);
      text-decoration: none;
      font-size: .9rem;
      font-weight: 500;
      letter-spacing: .06em;
      transition: color .2s;
    }

    .nav-links a:hover { color: var(--white); }
    .nav-links a.is-active { color: var(--purple); }

    .nav-book {
      background: linear-gradient(135deg, var(--purple), var(--pink)) !important;
      color: var(--white) !important;
      padding: .45rem 1.15rem;
      border-radius: 999px;
      font-weight: 700 !important;
      transition: opacity .2s, transform .15s;
    }
    .nav-book:hover { opacity: .88; transform: translateY(-1px); }

    /* ── PAGE SHELL ───────────────────────────────────── */
    main {
      padding-top: calc(var(--nav-h) + 3.5rem);
      padding-bottom: 4rem;
      padding-left:  clamp(1.25rem, 5vw, 4rem);
      padding-right: clamp(1.25rem, 5vw, 4rem);
      max-width: 1180px;
      margin: 0 auto;
    }

    .page-eyebrow {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: .55rem;
    }

    .page-heading {
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: 900;
      letter-spacing: .08em;
      line-height: 1;
      margin-bottom: 3rem;
      color: var(--white);
      text-shadow:
        0 0  6px #fff,
        0 0 14px rgba(139,92,246,.8),
        0 0 35px rgba(139,92,246,.5),
        0 0 60px rgba(236,72,153,.35);
    }

    /* ── LAYOUT ───────────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1.75rem;
      align-items: start;
    }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* ── PLAYER CARD ──────────────────────────────────── */
    .player-card {
      background: var(--card);
      border: 1px solid rgba(139,92,246,.22);
      border-radius: 24px;
      padding: 1.75rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(139,92,246,.08);
    }

    .player-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(139,92,246,.04) 0%, rgba(236,72,153,.03) 100%);
      pointer-events: none;
    }

    /* ── ALBUM ART ────────────────────────────────────── */
    .art {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      background: #0a0a0a;
      position: relative;
      overflow: hidden;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(139,92,246,.15);
    }

    .art-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(55px);
    }

    .art-orb-a {
      width: 75%; height: 75%;
      background: var(--purple);
      top: -8%; left: -8%;
      opacity: .5;
      animation: pulse-a 4s ease-in-out infinite alternate;
    }

    .art-orb-b {
      width: 65%; height: 65%;
      background: var(--pink);
      bottom: -8%; right: -8%;
      opacity: .42;
      animation: pulse-b 5.5s ease-in-out infinite alternate;
    }

    @keyframes pulse-a {
      from { transform: scale(1) translate(0,0);       opacity: .42; }
      to   { transform: scale(1.22) translate(6%,6%);  opacity: .62; }
    }

    @keyframes pulse-b {
      from { transform: scale(1) translate(0,0);         opacity: .34; }
      to   { transform: scale(1.18) translate(-6%,-6%);  opacity: .55; }
    }

    .art-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* ── VINYL ────────────────────────────────────────── */
    .vinyl-ring {
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(139,92,246,.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 28px rgba(139,92,246,.3), inset 0 0 20px rgba(139,92,246,.1);
      animation: spin 8s linear infinite;
      animation-play-state: paused;
    }
    .vinyl-ring.spinning { animation-play-state: running; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .vinyl-inner {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: #0a0a0a;
      border: 2px solid rgba(139,92,246,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    /* Smaller vinyl for sticky panel */
    .vinyl-ring.sm { width: 80px; height: 80px; }
    .vinyl-ring.sm .vinyl-inner { width: 40px; height: 40px; font-size: .95rem; }

    /* ── EQ BARS ──────────────────────────────────────── */
    .eq-bars {
      display: flex;
      gap: 4px;
      align-items: flex-end;
      height: 26px;
      margin-top: 1rem;
      opacity: 0;
      transition: opacity .4s;
    }

    .eq-bars.active { opacity: 1; }

    .eq-bar {
      width: 4px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--pink), var(--purple));
      animation: eq-bounce var(--d) ease-in-out infinite alternate;
      animation-play-state: paused;
    }

    .eq-bars.active .eq-bar { animation-play-state: running; }

    @keyframes eq-bounce {
      from { height: 3px;    opacity: .6; }
      to   { height: var(--h); opacity: 1; }
    }

    .eq-bars.sm { margin-top: .6rem; height: 18px; }
    .eq-bars.sm .eq-bar { width: 3px; }

    /* ── TRACK INFO ───────────────────────────────────── */
    .track-info { margin-bottom: 1.25rem; }

    .track-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-sub {
      font-size: .76rem;
      color: rgba(248,248,248,.38);
      margin-top: .3rem;
      letter-spacing: .06em;
    }

    /* ── PROGRESS AREA ────────────────────────────────── */
    .progress-area { margin-bottom: 1.25rem; }

    /* progress bar + inline time, shared by main card and sticky panel */
    .progress-row {
      display: flex;
      align-items: center;
      gap: .65rem;
    }

    .progress-row input[type=range] {
      flex: 1;
      min-width: 0;
    }

    .time-display {
      font-family: 'Courier New', Courier, monospace;
      font-size: .68rem;
      color: rgba(248,248,248,.38);
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
    }

    /* ── RANGE INPUTS ─────────────────────────────────── */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
      background: rgba(248,248,248,.08);
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 0 8px rgba(139,92,246,.9);
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.35);
      box-shadow: 0 0 16px rgba(236,72,153,1);
    }

    input[type=range]::-moz-range-thumb {
      width: 14px; height: 14px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 0 8px rgba(139,92,246,.9);
      cursor: pointer;
    }

    /* Thin variant for compact bar */
    input[type=range].thin {
      height: 3px;
    }

    input[type=range].thin::-webkit-slider-thumb {
      width: 10px; height: 10px;
    }

    input[type=range].thin::-moz-range-thumb {
      width: 10px; height: 10px;
    }

    /* ── PLAYBACK CONTROLS ────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      margin-bottom: 1.5rem;
    }

    .ctrl {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(248,248,248,.55);
      border-radius: 50%;
      width: 40px; height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .2s, transform .15s;
    }

    .ctrl:hover { color: var(--white); transform: scale(1.18); }
    .ctrl svg { display: block; pointer-events: none; }

    .ctrl-play {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: var(--white);
      box-shadow: 0 0 22px rgba(139,92,246,.65), 0 0 50px rgba(236,72,153,.3);
      transition: transform .2s, box-shadow .2s, color .2s;
    }

    .ctrl-play:hover {
      transform: scale(1.1);
      box-shadow: 0 0 36px rgba(139,92,246,.9), 0 0 75px rgba(236,72,153,.55);
      color: var(--white);
    }

    /* ── VOLUME ───────────────────────────────────────── */
    .volume-row {
      display: flex;
      align-items: center;
      gap: .7rem;
    }

    .vol-icon { color: rgba(248,248,248,.35); flex-shrink: 0; }

    /* ── PLAYLIST ─────────────────────────────────────── */
    .playlist-card {
      background: var(--card);
      border: 1px solid rgba(139,92,246,.18);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(139,92,246,.05);
    }

    .playlist-head {
      padding: 1.4rem 1.75rem .9rem;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(248,248,248,.3);
      border-bottom: 1px solid rgba(139,92,246,.1);
    }

    .playlist-item {
      display: grid;
      grid-template-columns: 2.2rem 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 1.75rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(139,92,246,.07);
      position: relative;
      transition: background .2s;
    }

    .playlist-item:last-child { border-bottom: none; }
    .playlist-item:hover { background: rgba(139,92,246,.07); }
    .playlist-item.is-active { background: rgba(139,92,246,.12); }

    .playlist-item.is-active::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--purple), var(--pink));
      border-radius: 0 2px 2px 0;
    }

    .item-num {
      font-size: .78rem;
      font-weight: 600;
      color: rgba(248,248,248,.28);
      text-align: center;
      font-variant-numeric: tabular-nums;
      transition: color .2s;
    }

    .playlist-item.is-active .item-num { color: var(--purple); }

    .item-info { min-width: 0; }

    .item-title {
      font-size: .9rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-item.is-active .item-title {
      background: linear-gradient(90deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .item-genre {
      font-size: .7rem;
      color: rgba(248,248,248,.32);
      margin-top: .18rem;
    }

    .item-dur {
      font-size: .75rem;
      color: rgba(248,248,248,.3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ── VISUALIZER CANVAS ───────────────────────────── */
    .viz-canvas {
      display: block;
      width: 100%;
      height: 72px;
      border-radius: 8px;
      margin-bottom: 1.25rem;
    }

    .viz-canvas.sm {
      height: 52px;
      margin-bottom: .85rem;
    }

    /* ══════════════════════════════════════════════════
       STICKY PLAYER
    ══════════════════════════════════════════════════ */

    /* backdrop shown when expanded */
    .sp-backdrop {
      position: fixed;
      inset: 0;
      z-index: 199;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .38s;
    }

    .sp-backdrop.active {
      opacity: 1;
      pointer-events: all;
    }

    /* outer shell — only bottom 76px visible by default */
    .sticky-player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 200;
      height: var(--sp-h);
      transform: translateY(calc(100% - var(--bar-h)));
      transition: transform .42s cubic-bezier(.32, .72, 0, 1);
      display: flex;
      flex-direction: column;
      background: var(--card);
      box-shadow: 0 -2px 0 rgba(139,92,246,.3), 0 -12px 50px rgba(0,0,0,.7);
    }

    .sticky-player.expanded {
      transform: translateY(0);
    }

    /* ── EXPANDED PANEL ───────────────────────────────── */
    .sp-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* top padding replaces the old drag handle */
      padding: 1.1rem clamp(1.5rem, 6vw, 3rem) 1rem;
      overflow: hidden;
      opacity: 0;
      transition: opacity .18s;
    }

    .sticky-player.expanded .sp-panel { opacity: 1; transition-delay: .18s; }

    /* small art in expanded panel */
    .sp-art {
      width: 140px; height: 140px;
      border-radius: 14px;
      background: #0a0a0a;
      border: 1px solid rgba(139,92,246,.2);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      margin-bottom: 1.1rem;
    }

    .sp-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(35px);
    }

    .sp-orb-a {
      width: 80%; height: 80%;
      background: var(--purple);
      top: -10%; left: -10%;
      opacity: .55;
      animation: pulse-a 4s ease-in-out infinite alternate;
    }

    .sp-orb-b {
      width: 70%; height: 70%;
      background: var(--pink);
      bottom: -10%; right: -10%;
      opacity: .45;
      animation: pulse-b 5.5s ease-in-out infinite alternate;
    }

    .sp-art-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* track info in expanded */
    .sp-info {
      text-align: center;
      margin-bottom: .9rem;
      width: 100%;
    }

    .sp-title {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sp-sub {
      font-size: .72rem;
      color: rgba(248,248,248,.38);
      margin-top: .25rem;
      letter-spacing: .05em;
    }

    /* progress in expanded */
    .sp-progress-wrap {
      width: 100%;
      margin-bottom: .85rem;
    }

    /* controls in expanded */
    .sp-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      margin-bottom: .9rem;
    }

    /* volume in expanded */
    .sp-vol-row {
      display: flex;
      align-items: center;
      gap: .7rem;
      width: 100%;
    }

    /* ── COMPACT BAR ──────────────────────────────────── */
    .sp-bar {
      height: var(--bar-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 0 clamp(.75rem, 3vw, 1.5rem);
      /* border now goes BELOW the bar — separates it from the expanded panel */
      border-bottom: 1px solid rgba(139,92,246,.15);
      cursor: pointer;
      user-select: none;
    }

    /* mini thumbnail orb */
    .sp-thumb {
      width: 46px; height: 46px;
      border-radius: 10px;
      background: #0a0a0a;
      border: 1px solid rgba(139,92,246,.2);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sp-thumb-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(14px);
    }

    .sp-thumb-orb-a {
      width: 100%; height: 100%;
      background: var(--purple);
      top: -20%; left: -20%;
      opacity: .7;
    }

    .sp-thumb-orb-b {
      width: 80%; height: 80%;
      background: var(--pink);
      bottom: -20%; right: -20%;
      opacity: .6;
    }

    /* meta + mini progress */
    .sp-bar-mid {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: .42rem;
    }

    .sp-mini-meta {
      display: flex;
      align-items: baseline;
      gap: .5rem;
      min-width: 0;
    }

    .sp-mini-title {
      font-size: .85rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 1;
      min-width: 0;
    }

    .sp-mini-genre {
      font-size: .68rem;
      color: rgba(248,248,248,.35);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* play btn in compact bar */
    .sp-mini-play {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--white);
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(139,92,246,.55);
      transition: transform .15s, box-shadow .15s;
    }

    .sp-mini-play:hover {
      transform: scale(1.1);
      box-shadow: 0 0 22px rgba(139,92,246,.8);
    }

    .sp-mini-play svg { display: block; pointer-events: none; }

    /* chevron expand/collapse btn */
    .sp-chevron {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(248,248,248,.4);
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color .2s, background .2s, transform .38s;
    }

    .sp-chevron:hover { color: var(--white); background: rgba(139,92,246,.12); }

    /* collapsed = chevron ↓ (open); expanded = chevron ↑ (close) */
    .sticky-player.expanded .sp-chevron { transform: rotate(180deg); }

    .sp-chevron svg { display: block; pointer-events: none; }

    /* ── FOOTER ───────────────────────────────────────── */
    .site-footer {
      position: relative;
      margin-top: 5rem;
      padding: 3rem clamp(1.25rem, 5vw, 3rem) 2.5rem;
    }

    .site-footer::before {
      content: '';
      position: absolute;
      top: 0;
      left: clamp(1.25rem, 8%, 5rem);
      right: clamp(1.25rem, 8%, 5rem);
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        var(--purple) 30%,
        var(--pink)   70%,
        transparent
      );
    }

    .footer-inner {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
    }

    .footer-logo {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: .14em;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .footer-social {
      display: flex;
      gap: .85rem;
      align-items: center;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(139,92,246,.25);
      color: rgba(248,248,248,.45);
      text-decoration: none;
      transition: color .22s, border-color .22s, background .22s, transform .22s;
      -webkit-tap-highlight-color: transparent;
    }

    .social-link:hover {
      color: var(--white);
      border-color: rgba(236,72,153,.6);
      background: rgba(236,72,153,.1);
      transform: translateY(-3px);
    }

    .social-link svg {
      width: 18px;
      height: 18px;
      display: block;
      flex-shrink: 0;
    }

    .footer-email {
      font-size: .87rem;

<script>
(function () {
  var loader = document.getElementById('pageLoader');
  var fill   = document.getElementById('loaderFill');
  var start  = Date.now(), raf;

  function tick() {
    var t = Math.min(1, (Date.now() - start) / 1100);
    fill.style.width = ((1 - Math.pow(1 - t, 3)) * 75) + '%';
    if (t < 1) raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);

  function finish() {
    cancelAnimationFrame(raf);
    var wait = Math.max(0, 850 - (Date.now() - start));
    setTimeout(function () {
      fill.style.transition = 'width .3s ease-out';
      fill.style.width = '100%';
      setTimeout(function () {
        loader.style.transition = 'opacity .5s ease';
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 520);
      }, 320);
    }, wait);
  }

  if (document.readyState === 'complete') finish();
  else window.addEventListener('load', finish, { once: true });
}());
</script>

      const src = audioCtx.createMediaElementSource(audio);
      src.connect(gainNode);
      gainNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      audioCtx.resume(); // iOS creates contexts suspended; resume inside the user gesture
    } catch (e) { /* browser may not support Web Audio */ }
  }

  function drawBars(canvas, freqData) {
    const dpr  = window.devicePixelRatio || 1;
    const cssW = canvas.offsetWidth;
    const cssH = canvas.offsetHeight;
    if (!cssW || !cssH) return;

    const bW = Math.round(cssW * dpr);
    const bH = Math.round(cssH * dpr);
    if (canvas.width !== bW || canvas.height !== bH) {
      canvas.width  = bW;
      canvas.height = bH;
    }

    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, bW, bH);

    const gap  = 2 * dpr;
    const barW = (bW - gap * (VIZ_BARS - 1)) / VIZ_BARS;

    for (let i = 0; i < VIZ_BARS; i++) {
      const v    = freqData[i] / 255;
      const barH = Math.max(2 * dpr, v * bH * 0.96);
      const x    = i * (barW + gap);
      const y    = bH - barH;
      const r    = Math.min(barW * 0.45, 3 * dpr);

      /* purple-at-peak → pink-at-base gradient per bar */
      const grad = ctx.createLinearGradient(0, y, 0, bH);
      grad.addColorStop(0, 'rgba(139,92,246,.95)');
      grad.addColorStop(1, 'rgba(236,72,153,.85)');
      ctx.fillStyle = grad;

      /* rounded top corners only */
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + barW - r, y);
      ctx.arcTo(x + barW, y,  x + barW, y + r, r);
      ctx.lineTo(x + barW, bH);
      ctx.lineTo(x,        bH);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
      ctx.fill();
    }
  }

  function vizLoop() {
    if (!analyser) return;
    const data = new Uint8Array(analyser.frequencyBinCount); // 64 bins
    analyser.getByteFrequencyData(data);
    const slice = data.slice(0, VIZ_BARS);

    drawBars(vizCanvas, slice);
    if (spExpanded) drawBars(spVizCanvas, slice); // skip hidden canvas

    vizRaf = requestAnimationFrame(vizLoop);
  }

  function startViz() {
    if (!vizRaf) vizLoop();
  }

  function stopViz() {
    if (vizRaf) { cancelAnimationFrame(vizRaf); vizRaf = null; }
    /* settle bars to zero */
    drawBars(vizCanvas,   new Uint8Array(VIZ_BARS));
    drawBars(spVizCanvas, new Uint8Array(VIZ_BARS));
  }

  /* ── HELPERS ─────────────────────────────────────────── */
  function fmt(s) {
    if (!s || isNaN(s)) return '0:00';
    return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2,'0')}`;
  }

  function fillRange(el, pct) {
    el.style.background =
      `linear-gradient(to right,#8B5CF6 0%,#EC4899 ${pct}%,rgba(248,248,248,.1) ${pct}%)`;
  }

  /* Update every progress bar from a single value */
  function syncProgress(pct) {
    [progressEl, spFullProg, spMiniProg].forEach(r => {
      r.value = pct;
      fillRange(r, pct);
    });
  }

  /* ── RENDER ALL PLAYERS ──────────────────────────────── */
  function renderPlayState(isPlaying) {
    playing = isPlaying;
    const path = isPlaying ? PAUSE_PATH : PLAY_PATH;
    [playIcon, spPlayIcon, spMiniPlayIcon].forEach(svg => { svg.innerHTML = path; });
    [eqBars, spEqBars].forEach(el => el.classList.toggle('active', isPlaying));
    [vinyl, spVinyl].forEach(el => el.classList.toggle('spinning', isPlaying));
    isPlaying ? startViz() : stopViz();
  }

  function renderTrack(idx) {
    const t = TRACKS[idx];
    nowTitle.textContent    = t.title;
    nowSub.textContent      = `DJ Carlos · ${t.genre}`;
    spTitle.textContent     = t.title;
    spSub.textContent       = `DJ Carlos · ${t.genre}`;
    spMiniTitle.textContent = t.title;
    spMiniGenre.textContent = t.genre;
    // reset times
    timeDisplay.textContent = spTimeDisplay.textContent = '0:00 / 0:00';
    syncProgress(0);
    // playlist highlight
    document.querySelectorAll('.playlist-item').forEach((el, i) =>
      el.classList.toggle('is-active', i === idx)
    );
  }

  /* ── EXPAND / COLLAPSE ───────────────────────────────── */
  function setExpanded(val) {
    spExpanded = val;
    stickyPlayer.classList.toggle('expanded', val);
    spBackdrop.classList.toggle('active', val);
    spPanel.setAttribute('aria-hidden', val ? 'false' : 'true');
    document.body.style.overflow = val ? 'hidden' : '';
    /* kick off a draw so the sticky canvas isn't blank on first open */
    if (val && playing) requestAnimationFrame(() => {
      if (analyser) {
        const d = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(d);
        drawBars(spVizCanvas, d.slice(0, VIZ_BARS));
      }
    });
  }

  /* Compact bar: whole row expands except the play btn & chevron */
  spBar.addEventListener('click', () => { if (!spExpanded) setExpanded(true); });
  spMiniPlay.addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
  spChevron.addEventListener('click', e => { e.stopPropagation(); setExpanded(!spExpanded); });
  spBackdrop.addEventListener('click', () => setExpanded(false));

  /* ── PLAYBACK ────────────────────────────────────────── */
  function loadAndPlay(idx, fade = false) {
    initAudio();
    if (crossfadeTimer) { clearTimeout(crossfadeTimer); crossfadeTimer = null; }
    currentIdx = idx;

    const doFade = fade && playing && gainNode && audioCtx;

    const startNext = () => {
      audio.src = TRACKS[idx].src;
      renderTrack(idx);
      audio.play()
        .then(() => {
          if (gainNode && audioCtx) {
            const t = audioCtx.currentTime;
            gainNode.gain.cancelScheduledValues(t);
            gainNode.gain.setValueAtTime(0, t);
            gainNode.gain.linearRampToValueAtTime(1, t + 0.5);
          }
          renderPlayState(true);
        })
        .catch(() => {
          if (gainNode && audioCtx) gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
          renderPlayState(false);
        });
    };

    if (doFade) {
      const now = audioCtx.currentTime;
      gainNode.gain.cancelScheduledValues(now);
      gainNode.gain.setValueAtTime(gainNode.gain.value, now);
      gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
      crossfadeTimer = setTimeout(() => { crossfadeTimer = null; startNext(); }, 500);
    } else {
      if (gainNode && audioCtx) gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
      startNext();
    }
  }

  function togglePlay() {
    if (!audio.src) { loadAndPlay(currentIdx); return; }
    initAudio();
    if (playing) {
      audio.pause();
      renderPlayState(false);
    } else {
      audio.play().then(() => renderPlayState(true)).catch(() => {});
    }
  }

  /* ── CONTROL WIRING ──────────────────────────────────── */
  [playBtn, spPlay].forEach(btn => btn.addEventListener('click', togglePlay));

  function goPrev() {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    currentIdx = (currentIdx - 1 + TRACKS.length) % TRACKS.length;
    loadAndPlay(currentIdx, true);
  }

  function goNext(fade = false) {
    currentIdx = (currentIdx + 1) % TRACKS.length;
    loadAndPlay(currentIdx, fade);
  }

  [prevBtn, spPrev].forEach(btn => btn.addEventListener('click', goPrev));
  [nextBtn, spNext].forEach(btn => btn.addEventListener('click', () => goNext(true)));

  audio.addEventListener('ended', () => goNext(false));

  /* ── PROGRESS SYNC ───────────────────────────────────── */
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    syncProgress(pct);
    const combined = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
    timeDisplay.textContent = spTimeDisplay.textContent = combined;
  });

  audio.addEventListener('loadedmetadata', () => {
    const combined = `0:00 / ${fmt(audio.duration)}`;
    timeDisplay.textContent = spTimeDisplay.textContent = combined;
  });

  /* Scrubbing from any of the three progress bars */
  [progressEl, spFullProg, spMiniProg].forEach(r => {
    r.addEventListener('input', () => {
      if (!audio.duration) return;
      audio.currentTime = (r.value / 100) * audio.duration;
      syncProgress(r.value);
    });
    /* stop bar-click expand when dragging the mini progress */
    r.addEventListener('click', e => e.stopPropagation());
  });

  /* ── VOLUME SYNC ─────────────────────────────────────── */
  audio.volume = parseFloat(volSlider.value);

  function setVolume(val) {
    audio.volume = parseFloat(val);
    fillRange(volSlider, val * 100);
    fillRange(spVol, val * 100);
    volSlider.value = val;
    spVol.value = val;
  }

  volSlider.addEventListener('input', () => setVolume(volSlider.value));
  spVol.addEventListener('input',     () => setVolume(spVol.value));

  /* ── PLAYLIST BUILD ──────────────────────────────────── */
  TRACKS.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'playlist-item';
    el.innerHTML = `
      <div class="item-num" id="num-${i}">${String(i+1).padStart(2,'0')}</div>
      <div class="item-info">
        <div class="item-title">${t.title}</div>
        <div class="item-genre">${t.genre}</div>
      </div>
      <div class="item-dur" id="dur-${i}">—:——</div>`;
    el.addEventListener('click', () => loadAndPlay(i, true));
    playlistEl.appendChild(el);

    const tmp = new Audio();
    tmp.preload = 'metadata';
    tmp.src = t.src;
    tmp.addEventListener('loadedmetadata', () => {
      const d = document.getElementById(`dur-${i}`);
      if (d) d.textContent = fmt(tmp.duration);
    });
  });

  /* ── INIT ────────────────────────────────────────────── */
  syncProgress(0);
  setVolume(0.8);
  // Pre-load first track UI without touching Web Audio —
  // AudioContext requires a user gesture; createMediaElementSource called
  // without one produces a suspended context that silences all audio.
  audio.src = TRACKS[0].src;
  renderTrack(0);
  renderPlayState(false);

  /* ── TAP-TO-PLAY OVERLAY (mobile audio unlock) ───────── */
  const tapOverlay = document.getElementById('tapOverlay');
  const tapBtn     = document.getElementById('tapBtn');
  const UNLOCK_KEY = 'dj-carlos-audio-unlocked';

  // Show on any touch device that hasn't unlocked yet this session
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (isTouchDevice && !sessionStorage.getItem(UNLOCK_KEY)) {
    tapOverlay.classList.add('visible');
  }

  tapBtn.addEventListener('click', () => {
    // Both calls must be synchronous inside this gesture handler so iOS
    // counts them as user-initiated:
    // 1. Build the Web Audio graph and resume the context
    initAudio();
    // 2. Prime the audio element — iOS requires at least one play() call
    //    inside a user gesture before subsequent calls work from timers/promises
    audio.play().then(() => {
      audio.pause();
      audio.currentTime = 0;
    }).catch(() => {});

    sessionStorage.setItem(UNLOCK_KEY, '1');

    // Fade out then remove from tab order
    tapOverlay.classList.remove('visible');
    tapOverlay.addEventListener('transitionend', () => {
      tapOverlay.setAttribute('aria-hidden', 'true');
      tapOverlay.style.pointerEvents = 'none';
    }, { once: true });
  });
</script>
  <script>
  (function () {
    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll('.fade-up').forEach(function(el) { el.classList.add('visible'); });
      return;
    }
    var io = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (!entry.isIntersecting) return;
        var el = entry.target;
        var delay = parseInt(el.dataset.delay || '0', 10);
        setTimeout(function() { el.classList.add('visible'); }, delay);
        io.unobserve(el);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.fade-up').forEach(function(el) { io.observe(el); });
  }());
  </script>
</body>
</html>
